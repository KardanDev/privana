<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Privana — revisão da experiência</title>
    <link href="/brand/favicon.svg" rel="icon" type="image/svg+xml">
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..700&family=Hanken+Grotesk:wght@400..700&display=swap"
      rel="stylesheet"
    >
    <link href="/styles.css" rel="stylesheet">
    <script src="/main.mjs" type="module"></script>
  </head>
  <body>
    <a class="skip" href="#screen-title">Pular para a tela</a>
    <header class="review-tools">
      <div>
        <strong>Privana · revisão da experiência</strong>
        <p>Protótipo com dados fictícios. Nenhuma operação real.</p>
      </div>
      <label>Caso em revisão<select id="scenario"></select></label>
      <button aria-pressed="false" id="theme" type="button">Tema escuro</button>
      <a href="/">Reiniciar</a>
      <output aria-live="polite" id="route"></output>
      <details>
        <summary>Sobre este caso</summary>
        <p id="scenario-note"></p>
      </details>
    </header>
    <div class="stage" id="stage">
      <aside class="sidebar">
        <a aria-label="Privana, início do exemplo" class="brand" href="#harness"
          ><img
            alt="Privana"
            class="brand-light"
            height="64"
            src="/brand/wordmark.svg"
            width="240"
          ><img
            alt="Privana"
            class="brand-dark"
            height="64"
            src="/brand/wordmark-inverse.svg"
            width="240"
          ></a
        >
        <nav aria-label="Navegação da tela" id="side-navigation"></nav>
        <p class="sidebar-note">Conta de demonstração</p>
      </aside>
      <main aria-labelledby="screen-title" id="screen"></main>
      <nav
        aria-label="Navegação da tela no celular"
        class="mobile-navigation"
        id="mobile-navigation"
      ></nav>
    </div>
    <noscript>Ative JavaScript para navegar entre os exemplos locais.</noscript>
  </body>
</html>
