name: Quality

on:
  pull_request:
    branches: [main, "codex/**"]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      NODE_ENV: test
      BETTER_AUTH_SECRET: ci-only-nonsecret-value-with-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3001
      DATABASE_URL: postgres://ci:ci@127.0.0.1:1/privana_ci?sslmode=disable
      EMAIL_DELIVERY_MODE: preview
      RESEND_API_KEY: ""
      EMAIL_FROM: ""
      UPSTASH_BLOB_TOKEN: ""
      UPSTASH_REDIS_REST_URL: ""
      UPSTASH_REDIS_REST_TOKEN: ""
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Generate environment types
        run: bun run env:generate
      - name: Generate Prisma client
        run: bun run db:generate
      - name: Check formatting and lint
        run: bun run check
      - name: Check package types
        run: bun run check-types
      - name: Check maintenance script types
        run: bun run check-types:scripts
      - name: Run deterministic tests
        run: bun run test
      - name: Verify Linear automation with isolated API fixtures
        run: node --test scripts/linear-ci/tests/*.test.mjs
      - name: Compile production build
        run: bun run build
        env:
          NODE_ENV: production
          EMAIL_DELIVERY_MODE: resend
      # Varlock resolves server configuration into the build. Synthetic CI
      # output is disposable: never upload/cache/promote .next or resolved env.

  quality-gate:
    name: Quality gate
    if: always()
    needs: [repository-checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every repository check to pass
        env:
          REPOSITORY_RESULT: ${{ needs.repository-checks.result }}
        run: test "$REPOSITORY_RESULT" = success
